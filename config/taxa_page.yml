# Taxon page tabs and panels.
# The big photo with the taxon name (taxon-hero/) sits above the tabs on every tab.

taxa_page:
  overview:
    label: Overview
    panels:
      - - - 'panel:names'
          - 'panel:content'
          - 'panel:keys'
          - 'panel:similar'

        - - 'panel:map'
          - 'panel:external'
          - 'panel:knowledge'
          - 'panel:identify'
          - 'panel:fossil'
          - 'panel:children'
          - 'panel:hosts-summary'
          - 'panel:type-specimen'
          - 'panel:type'
          - 'panel:sounds'
          - 'panel:cite'

  hosts:
    label: Hosts & associations
    panels:
      - - - 'panel:hosts'
      - - - 'panel:biological-association-graphs'

  specimens:
    label: Specimens
    panels:
      - - - 'panel:specimens'

  literature:
    label: Literature
    panels:
      - - - 'panel:literature'

  images:
    label: Images
    panels:
      - - - 'panel:images'
